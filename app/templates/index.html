<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Routes</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <header>
        <h1>Mountain Routes</h1>
        <div id="global-stats"></div>
        <div id="auth-section">
            <span id="user-info"></span>
            <button id="btn-logout" style="display:none" onclick="logout()">Logout</button>
            <button id="btn-show-login" onclick="showForm('login-form')">Login</button>
            <button id="btn-show-register" onclick="showForm('register-form')">Register</button>
        </div>
    </header>

    <div id="auth-forms">
        <div id="login-form" class="form-popup" style="display:none">
            <h3>Login</h3>
            <input type="text" id="login-username" placeholder="Username" />
            <input type="password" id="login-password" placeholder="Password" />
            <input type="text" id="login-totp" placeholder="2FA code (if enabled)" style="display:none" />
            <button onclick="login()">Login</button>
            <button class="btn-cancel" onclick="hideForms()">Cancel</button>
        </div>

        <div id="register-form" class="form-popup" style="display:none">
            <h3>Register</h3>
            <input type="text" id="reg-username" placeholder="Username" />
            <input type="email" id="reg-email" placeholder="Email" />
            <input type="password" id="reg-password" placeholder="Password" />
            <button onclick="register()">Register</button>
            <button class="btn-cancel" onclick="hideForms()">Cancel</button>
        </div>
    </div>

    <main>
        <div id="map"></div>

        <aside id="sidebar">
            <div id="route-list-section">
                <h2>Routes</h2>
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Search routes..." onkeyup="searchRoutes()" />
                </div>
                <div class="filter-bar">
                    <label class="checkbox-label">
                        <input type="checkbox" id="my-routes-only" disabled onchange="filterMyRoutes()" />
                        My routes only
                    </label>
                </div>
                <ul id="route-list"></ul>
            </div>

            <div id="route-stats-panel" style="display:none"></div>

            <div id="add-route-section">
                <h2>Add Route</h2>
                <input type="text" id="route-name" placeholder="Route name" />
                <textarea id="route-desc" placeholder="Description"></textarea>
                <p class="hint">Click on the map to add points</p>
                <p>Points: <span id="point-count">0</span> | Distance: <span id="route-distance">0.00</span> km</p>
                <button id="btn-save-route" onclick="saveRoute()">Save Route</button>
                <button class="btn-cancel" onclick="clearNewRoute()">Clear</button>
            </div>

            <div id="2fa-section" style="display:none">
                <h2>Two-Factor Auth</h2>
                <div id="2fa-status"></div>
                <button id="btn-toggle-2fa" onclick="toggle2FASetup()">Enable 2FA</button>
                <div id="2fa-setup" style="display:none">
                    <p>1. Install Google Authenticator</p>
                    <p>2. Scan QR code:</p>
                    <img id="2fa-qr" style="background:#fff;padding:8px;border-radius:6px;max-width:200px" />
                    <p>Or enter secret manually:</p>
                    <code id="2fa-secret" style="word-break:break-all;color:#53d8fb"></code>
                    <input type="text" id="2fa-confirm-code" placeholder="Enter code from app" />
                    <button onclick="confirm2FA()">Confirm & Enable</button>
                </div>
                <div id="2fa-disable" style="display:none">
                    <p>Enter code from authenticator to disable:</p>
                    <input type="text" id="2fa-disable-code" placeholder="2FA code" />
                    <button class="btn-cancel" onclick="disable2FA()">Disable 2FA</button>
                </div>
            </div>
        </aside>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
